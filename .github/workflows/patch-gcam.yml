name: Patch MGC (BSG) GCam (disable direct gyro channel)

on:
  workflow_dispatch:
    inputs:
      gcam_url:
        description: "Direct download link of the MGC (BSG) GCam APK"
        required: true
      apktool_version:
        description: "apktool version"
        default: "2.9.3"
      control:
        description: "Control build: re-sign the ORIGINAL apk with NO patch (for testing the crash)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GCAM_URL: ${{ inputs.gcam_url }}
      CONTROL: ${{ inputs.control }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless zip unzip
          wget -q "https://github.com/iBotPeaches/apktool/releases/download/v${{ inputs.apktool_version }}/apktool_${{ inputs.apktool_version }}.jar" -O apktool.jar

      - name: Download GCam from link
        run: |
          curl -fL --retry 3 -A "Mozilla/5.0" "$GCAM_URL" -o GCam.apk
          ls -lh GCam.apk
          # sanity check: a real APK is a zip containing AndroidManifest.xml
          unzip -l GCam.apk | grep -q AndroidManifest.xml || {
            echo "Downloaded file is not an APK (link is probably a web page, not a direct link)"; exit 1; }
          echo "--- native libs in the original APK ---"
          unzip -Z1 GCam.apk | grep '^lib/' | sort || true

      # Used only to get patched dex files. The final APK is the ORIGINAL apk
      # with just those dex files swapped, so manifest, resources and native
      # libs (the MGC shim libs) stay byte-identical.
      - name: Decompile
        if: ${{ !inputs.control }}
        run: java -jar apktool.jar d -r -f GCam.apk -o out

      # Obfuscated class names differ between GCam builds, so the target is
      # found by its content instead of by file name.
      - name: Patch smali
        if: ${{ !inputs.control }}
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          CALL = re.compile(
              r"[ \t]*invoke-virtual \{v\d+, v\d+\}, Landroid/hardware/SensorManager;"
              r"->createDirectChannel\(Landroid/hardware/HardwareBuffer;\)"
              r"Landroid/hardware/SensorDirectChannel;\s*\n\s*"
              r"move-result-object (v\d+)\n")

          def dex_for(path):
              top = path.relative_to("out").parts[0]
              if top == "smali":
                  return "classes.dex"
              m = re.fullmatch(r"smali_classes(\d+)", top)
              if not m:
                  sys.exit(f"PATCH FAILED: cannot map {path} to a dex file")
              return f"classes{m.group(1)}.dex"

          hits = []
          for p in pathlib.Path("out").rglob("*.smali"):
              s = p.read_text(encoding="utf-8", errors="ignore")
              if "createDirectChannel" in s:
                  hits.append((p, s))

          print("files calling createDirectChannel:", [str(p) for p, _ in hits])
          if not hits:
              sys.exit("PATCH FAILED: no createDirectChannel call found "
                       "(this GCam build may not use direct gyro - nothing to patch)")

          total, dexes = 0, set()
          for p, s in hits:
              new, n = CALL.subn(lambda m: f"    const/4 {m.group(1)}, 0x0\n", s)
              if n:
                  p.write_text(new, encoding="utf-8")
                  print(f"patched {p}: {n} call(s)")
                  total += n
                  dexes.add(dex_for(p))
          if total == 0:
              sys.exit("PATCH FAILED: createDirectChannel found but pattern did not match; "
                       "send the smali around it so the pattern can be adjusted")

          open("patched_dex.txt", "w").write("\n".join(sorted(dexes)) + "\n")
          print("dex files to replace:", sorted(dexes))
          PY

      - name: Rebuild (only to get the patched dex)
        if: ${{ !inputs.control }}
        run: |
          java -jar apktool.jar b out -o rebuilt.apk
          ls -lh rebuilt.apk

      - name: Put patched dex into the original APK
        run: |
          cp GCam.apk work.apk
          # drop the old signature, it is invalid after the change anyway
          zip -q -d work.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          if [ "$CONTROL" = "true" ]; then
            echo "CONTROL BUILD: original APK, no dex change"
          else
            mkdir dex_out
            unzip -o rebuilt.apk $(cat patched_dex.txt) -d dex_out
            (cd dex_out && zip -q -X "$GITHUB_WORKSPACE/work.apk" $(cat "$GITHUB_WORKSPACE/patched_dex.txt"))
            for d in $(cat patched_dex.txt); do
              echo -n "$d: createDirectChannel references left = "
              unzip -p work.apk "$d" | grep -a -c createDirectChannel || true
            done
          fi

      # Keep the same signing key between runs so updates install over each other
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: gcam.jks
          key: bsg-gcam-signing-key-v1

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ ! -f gcam.jks ]; then
            keytool -genkeypair -keystore gcam.jks -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=bsg-gcam-patch"
          fi
          $BT/zipalign -p -f 4 work.apk aligned.apk
          OUT=GCam-patched.apk
          [ "$CONTROL" = "true" ] && OUT=GCam-control.apk
          $BT/apksigner sign --ks gcam.jks --ks-pass pass:android --key-pass pass:android \
            --out "$OUT" aligned.apk
          $BT/apksigner verify -v "$OUT" | head -5
          ls -lh "$OUT"

      # Everything except the patched dex files must match the original exactly
      - name: Verify only dex changed
        if: ${{ !inputs.control }}
        run: |
          python3 - <<'PY'
          import zipfile, re, sys
          o = zipfile.ZipFile("GCam.apk")
          p = zipfile.ZipFile("GCam-patched.apk")
          oi = {i.filename: i.CRC for i in o.infolist() if not i.filename.startswith("META-INF/")}
          pi = {i.filename: i.CRC for i in p.infolist() if not i.filename.startswith("META-INF/")}
          changed = sorted(n for n in oi if pi.get(n) != oi[n])
          print("changed or missing entries:", changed)
          print("new entries:", sorted(set(pi) - set(oi)))
          bad = [n for n in changed if not re.fullmatch(r"classes\d*\.dex", n)]
          if bad or set(pi) - set(oi):
              sys.exit(f"UNEXPECTED DIFFERENCES: {bad}")
          print("OK: only dex files differ from the original")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.control && 'GCam-control' || 'GCam-patched' }}
          path: GCam-*.apk
